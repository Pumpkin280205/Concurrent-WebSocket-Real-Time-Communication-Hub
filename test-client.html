<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WS Hub Test Client</title>
<style>
body{font-family:system-ui,sans-serif;max-width:600px;margin:24px;padding:0 16px;line-height:1.5}
#status{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ccc;margin-right:8px;vertical-align:middle}
pre#log{background:#f6f8fa;border:1px solid #d0d7de;border-radius:6px;padding:12px;max-height:300px;overflow:auto;font-family:ui-monospace,monospace;font-size:13px;white-space:pre-wrap}
button{margin-right:8px;padding:6px 12px;cursor:pointer}
button:disabled{opacity:0.5;cursor:not-allowed}
input{padding:4px 6px}
.row{margin:8px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<h3>WS Hub Test Client</h3>
<div class="row"><span id="status"></span><span id="statusText">disconnected</span></div>
<div class="row">
<label>user: <input id="user" value="alice"></label>
<label>channel: <input id="channel" value="general"></label>
<button id="btnConnect">connect</button>
<button id="btnSend" disabled>send</button>
<button id="btnDisconnect" disabled>disconnect</button>
</div>
<div class="row"><strong>Log:</strong></div>
<pre id="log"></pre>
<script>
const status = document.getElementById('status');
const statusText = document.getElementById('statusText');
const btnConnect = document.getElementById('btnConnect');
const btnSend = document.getElementById('btnSend');
const btnDisconnect = document.getElementById('btnDisconnect');
const log = document.getElementById('log');
let ws = null;

function m(t){ log.textContent += new Date().toLocaleTimeString()+': '+t+'\n'; log.scrollTop = log.scrollHeight; }

function setConnected(c){
  status.style.background = c ? '#2ea043' : '#cf222e';
  statusText.textContent = c ? 'connected' : 'disconnected';
  btnConnect.disabled = c;
  btnSend.disabled = !c;
  btnDisconnect.disabled = !c;
}

btnConnect.onclick = () => {
  const u = document.getElementById('user').value;
  const c = document.getElementById('channel').value;
  ws = new WebSocket('ws://localhost:3000?user='+encodeURIComponent(u)+'&channel='+encodeURIComponent(c));
  ws.onopen = () => { setConnected(true); m('connected as '+u+' in '+c); };
  ws.onmessage = ev => m('<< '+ev.data);
  ws.onclose = () => { setConnected(false); m('disconnected'); ws = null; };
  ws.onerror = e => m('error: connection failed (is the server running on :3000?)');
};

btnSend.onclick = () => {
  const c = document.getElementById('channel').value;
  const u = document.getElementById('user').value;
  const text = 'hello from '+u+' at '+new Date().toLocaleTimeString();
  ws.send(JSON.stringify({channel:c,text:text}));
  m('>> '+text);
};

btnDisconnect.onclick = () => { if(ws) ws.close(); };
</script>
</body>
</html>
